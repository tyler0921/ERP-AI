server:
  port: 8080

spring:
  application:
    name: ledgerguard-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerguard}
    username: ${DB_USER:ledgerguard}
    password: ${DB_PASSWORD:ledgerguard}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 단독으로 관리한다.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  zone: Asia/Seoul
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # 32바이트 이상. 운영/공유 환경에서는 반드시 JWT_SECRET 환경변수로 교체할 것.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-minutes: 30
    refresh-token-days: 14

management:
  endpoints:
    web:
      exposure:
        include: health,info
