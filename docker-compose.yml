# LedgerGuard AI 개발 환경.
# Phase 1~5: PostgreSQL + Valkey + SeaweedFS + Ollama + Spring Boot backend + FastAPI AI 서비스 + Next.js frontend.
# NVIDIA GPU가 있으면: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  postgres:
    # pgvector 확장이 포함된 PostgreSQL 16 (Phase 8 RAG에서 사용).
    image: pgvector/pgvector:pg16
    container_name: ledgerguard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerguard}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerguard} -d ${POSTGRES_DB:-ledgerguard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 캐시·비동기 작업 큐 (Redis 호환, BSD 라이선스)
  valkey:
    image: valkey/valkey:8.1.10-alpine
    container_name: ledgerguard-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 증빙 파일 저장소. master + volume + filer를 한 컨테이너로 실행한다.
  # 포트는 외부에 열지 않는다: 브라우저는 Spring을 거쳐 권한 확인 후에만 파일을 받는다.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: ledgerguard-seaweedfs
    # -ip: 다른 컨테이너에 알리는 주소, -ip.bind: 컨테이너 내부 healthcheck(localhost)도 받도록 모든 인터페이스에 바인딩
    command: "server -dir=/data -filer -ip=seaweedfs -ip.bind=0.0.0.0 -volume.max=20 -master.volumeSizeLimitMB=256"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8888/"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 로컬 LLM (이상거래 설명·분석 요약). 포트는 외부에 열지 않는다. 모델은 ai-service가 첫 실행 때 내려받아 볼륨에 캐시한다.
  # GPU 없이도 CPU로 동작하지만 느리다. 실패하거나 느려도 규칙 근거로 만든 템플릿 설명으로 대체된다.
  ollama:
    image: ollama/ollama:0.34.4
    container_name: ledgerguard-ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: ledgerguard-backend
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledgerguard}
      DB_USER: ${POSTGRES_USER:-ledgerguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ledgerguard}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      VALKEY_URL: redis://valkey:6379
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      # 이상탐지 ML(IsolationForest). ai-service가 없거나 느려도 규칙 점수만으로 동작한다.
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-change-me}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  # OCR(PaddleOCR) · 필드 추출 · 계정과목 후보 · 이상탐지 ML(IsolationForest) · LLM 설명(Ollama).
  # OCR·LLM 설명은 각자의 Valkey 큐를 소비해 결과를 backend 내부 API로 보내고, 이상탐지 ML은 backend가 동기 호출한다.
  ai-service:
    build:
      context: ./ai-service
    container_name: ledgerguard-ai-service
    depends_on:
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      VALKEY_URL: redis://valkey:6379/0
      SEAWEEDFS_FILER_URL: http://seaweedfs:8888
      BACKEND_URL: http://backend:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token-change-me}
      OLLAMA_URL: http://ollama:11434
      # 8GB VRAM에 맞는 7B 4비트 모델. 바꾸려면 .env에 LLM_MODEL을 지정한다.
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
    volumes:
      # OCR 모델은 첫 실행 때 내려받아 캐시한다 (재빌드해도 다시 받지 않음)
      - ocr-models:/models
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
    container_name: ledgerguard-frontend
    depends_on:
      - backend
    environment:
      # 브라우저는 Next.js(BFF)만 호출하고, Next.js 서버가 내부 네트워크로 백엔드를 호출한다.
      BACKEND_URL: http://backend:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres-data:
  valkey-data:
  seaweedfs-data:
  ocr-models:
    name: ledgerguard-ocr-models
  ollama-models:
    name: ledgerguard-ollama-models
