# LedgerGuard AI 개발 환경.
# Phase 1: PostgreSQL + Spring Boot backend + Next.js frontend.
# 이후 Phase에서 valkey, seaweedfs, ai-service(FastAPI), ollama가 이 파일에 추가된다.
services:
  postgres:
    # pgvector 확장이 포함된 PostgreSQL 16 (Phase 8 RAG에서 사용). Phase 1에서는 일반 PostgreSQL처럼 동작한다.
    image: pgvector/pgvector:pg16
    container_name: ledgerguard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerguard}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerguard} -d ${POSTGRES_DB:-ledgerguard}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ledgerguard-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledgerguard}
      DB_USER: ${POSTGRES_USER:-ledgerguard}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ledgerguard}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: ledgerguard-frontend
    depends_on:
      - backend
    environment:
      # 브라우저는 Next.js(BFF)만 호출하고, Next.js 서버가 내부 네트워크로 백엔드를 호출한다.
      BACKEND_URL: http://backend:8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres-data:
