server:
  port: 8080

spring:
  application:
    name: ledgerguard-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerguard}
    username: ${DB_USER:ledgerguard}
    password: ${DB_PASSWORD:ledgerguard}
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 Flyway가 단독으로 관리한다.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # 증빙 파일 최대 10MB (CSV는 BankController에서 2MB로 따로 제한)
      max-file-size: 10MB
      max-request-size: 11MB
  data:
    redis:
      url: ${VALKEY_URL:redis://localhost:6379}
      timeout: 3s
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  zone: Asia/Seoul
  # AI 서비스 콜백용 공유 토큰. 운영/공유 환경에서는 반드시 INTERNAL_API_TOKEN으로 교체할 것.
  internal-token: ${INTERNAL_API_TOKEN:dev-internal-token-change-me}
  storage:
    filer-url: ${SEAWEEDFS_FILER_URL:http://localhost:8888}
    root: ledgerguard
  queue:
    ocr-key: ledgerguard:ocr:jobs
  documents:
    ocr-timeout-minutes: ${OCR_TIMEOUT_MINUTES:15}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    # 32바이트 이상. 운영/공유 환경에서는 반드시 JWT_SECRET 환경변수로 교체할 것.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-minutes: 30
    refresh-token-days: 14

management:
  endpoints:
    web:
      exposure:
        include: health,info
